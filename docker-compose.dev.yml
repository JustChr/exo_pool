services:
  homeassistant:
    container_name: ha-zodiac-exo-dev
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      # Mount the custom component directly - edits reflect on restart
      - ./custom_components/zodiac_exo:/config/custom_components/zodiac_exo:ro
      # Persist HA config/state across restarts
      - ha-zodiac-exo-dev-config:/config
    ports:
      - "8125:8123"
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  ha-zodiac-exo-dev-config:
